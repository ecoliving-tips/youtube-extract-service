[project]
name = "youtube-extract-service"
version = "0.1.0"
description = "Bounded YouTube audio extraction service for swaram-chord-service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
extractor = [
  "yt-dlp[default]>=2025.1",
  "yt-dlp-ejs>=0.3.0",
  "bgutil-ytdlp-pot-provider==2.0.0",
]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
